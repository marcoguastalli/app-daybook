name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Same image as docker-compose.test.yml. PGDATA is pinned for the same
    # reason: postgres 18+ moved the default out of /var/lib/postgresql/data.
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: daybook_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          PGDATA: /var/lib/postgresql/data
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d daybook_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Build frontend
        run: bun run build

      - name: Unit tests
        run: bun test tests/unit

      - name: Integration tests
        run: bun test tests/integration
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 55432
          POSTGRES_DB: daybook_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test

  # E2E needs the full compose stack (app + postgres) and a browser, so it
  # builds the production image rather than reusing the job above.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile

      - name: Write .env for the stack
        run: |
          cat > .env <<'EOF'
          APP_PORT=7777
          APP_PASSWORD=ci-test-password
          SESSION_SECRET=ci-test-session-secret
          POSTGRES_DB=daybook
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci-test-password
          POSTGRES_DATA_DIR=/tmp/daybook-pgdata
          TZ=Europe/Madrid
          EOF
          mkdir -p /tmp/daybook-pgdata data/topics
          # Two writers share this directory: the app container (non-root
          # bun, uid/gid 1000, read-only fs everywhere else) and the E2E
          # tests, which edit files directly to simulate vim on the server.
          # Linux bind mounts pass host ownership straight through, so give
          # the runner ownership and bun's gid group-write — the same
          # arrangement the README documents for a real deployment. macOS
          # Docker Desktop virtualizes ownership, hence this is Linux-only.
          sudo chown -R "$(id -u)":1000 data/topics
          chmod -R g+w data/topics

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' daybook-app)" = "healthy" ] && exit 0
            sleep 5
          done
          docker compose logs
          exit 1

      - run: bunx playwright install --with-deps chromium

      - name: E2E tests
        run: bun run test:e2e

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs
